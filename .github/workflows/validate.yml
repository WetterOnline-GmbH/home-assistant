name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'homeassistant==2026.11.1' 'av==19.0.2' 'numpy==2.3.2' 'PyTurboJPEG==1.8.3' pytest pytest-cov
      - run: python -m pytest --cov=custom_components.wohome --cov-report=term-missing

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DevGuard secret scanning
        run: |
          docker run -v "$(pwd):/dev/app" ghcr.io/l3montree-dev/devguard/scanner:main \
            devguard-scanner secret-scanning --path /dev/app/ --noWrite
