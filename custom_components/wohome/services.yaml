set_display_rules:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: wohome
    expected:
      required: true
      selector:
        object:
    rules:
      required: true
      selector:
        object:
          multiple: true
          fields:
            is_active:
              label: Aktiv
              required: true
              selector:
                boolean:
            from:
              label: Einschalten
              required: true
              selector:
                time:
            to:
              label: Standby
              required: true
              selector:
                time:
            weekdays:
              label: Wochentage
              required: true
              selector:
                select:
                  multiple: true
                  options:
                    - label: Montag
                      value: Monday
                    - label: Dienstag
                      value: Tuesday
                    - label: Mittwoch
                      value: Wednesday
                    - label: Donnerstag
                      value: Thursday
                    - label: Freitag
                      value: Friday
                    - label: Samstag
                      value: Saturday
                    - label: Sonntag
                      value: Sunday
